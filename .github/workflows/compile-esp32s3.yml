name: Biên dịch ESP32-S3 Hybrid Core sang File BIN

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên GitHub

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Kiểm tra mã nguồn (Checkout)
        uses: actions/checkout@v4

      - name: Thiết lập cài đặt Arduino CLI chính thức
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "0.35.3" # Khóa phiên bản CLI ổn định

      - name: Cài đặt và Cấu hình Core ESP32 tuần tự (Mẫu chuẩn sạch)
        run: |
          # 1. Khởi tạo cấu hình mặc định để xóa sạch mọi index lỗi trước đó
          arduino-cli config init --overwrite
          
          # 2. Thêm duy nhất đường dẫn URL bổ sung của Espressif vào danh sách quản lý
          arduino-cli config set board_manager.additional_urls https://github.io
          
          # 3. Cập nhật chỉ mục index từ nguồn vừa cấu hình
          arduino-cli core update-index
          
          # 4. Tải và cài đặt core phần cứng esp32 bản mới nhất
          arduino-cli core install esp32:esp32

      - name: Biên dịch mã nguồn và Ép cấu hình phần cứng TinyUSB
        uses: arduino/compile-sketches@v1
        with:
          fqbn: "esp32:esp32:esp32s3"
          
          # Cài đặt tự động thư viện NimBLEDevice cho dự án
          libraries: |
            - name: "NimBLE-Arduino"

          # ÉP CẤU HÌNH PHẦN CỨNG: Bật chế độ USB-OTG TinyUSB để bo mạch ESP32-S3 nhận diện làm Chuột/Bàn phím
          cli-compile-flags: |
            --build-property "build.usb_mode=1"
            --build-property "build.cdc_on_boot=0"

          # Đường dẫn trỏ tới vị trí file .ino của bạn
          sketch-paths: |
            ./

      - name: Thu thập và đóng gói File .BIN thành phẩm
        uses: actions/upload-artifact@v4
        with:
          name: ESP32S3_Hybrid_HID_Core
          # Đường dẫn quét phủ rộng thu thập mọi file firmware .bin được xuất ra
          path: |
            /tmp/arduino-cli-sketches-**/*.bin
            /tmp/arduino/sketches/**/build/*.bin
            ./**/build/**/*.bin
          if-no-files-found: error
