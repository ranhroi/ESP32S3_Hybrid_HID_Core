name: Compile ESP32-S3 Hybrid HID Core

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  compile:
    name: Build firmware for ESP32-S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Arduino Sketch
        uses: arduino/compile-sketches@v1
        with:
          # ✅ FQBN đầy đủ với USB Mode cho ESP32-S3
          fqbn: esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=default,FlashMode=qio,FlashSize=4M
          
          # ✅ Chỉ định version core ESP32
          platforms: |
            - name: esp32:esp32
              version: "2.0.14"
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          
          # ✅ Chỉ định version NimBLE-Arduino 2.x
          libraries: |
            - name: NimBLE-Arduino
              version: "^2.1.0"
          
          sketch-paths: |
            - .
          
          cli-compile-flags: |
            --output-dir ${{ runner.temp }}/output
            --export-binaries

      - name: List output files
        run: ls -la ${{ runner.temp }}/output/ || true

      - name: Upload compiled firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-hybrid-hid-firmware
          path: ${{ runner.temp }}/output/*.bin
          if-no-files-found: error
