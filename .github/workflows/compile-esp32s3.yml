name: Biên dịch ESP32-S3 Hybrid Core sang File BIN

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên GitHub

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Kiểm tra mã nguồn (Checkout)
        uses: actions/checkout@v4

      - name: Thiết lập trình biên dịch Arduino CLI
        uses: arduino/compile-sketches@v1
        with:
          fqbn: "esp32:esp32:esp32s3"
          
          # [FIX] Đổi cú pháp khai báo JSON của Espressif thành chuỗi chuỗi trực tiếp để tránh lỗi tải archive format
          platforms: |
            - name: "esp32:esp32"
              source-url: "https://github.io"
          
          # Cài đặt tự động thư viện NimBLE-Arduino cho dự án của bạn
          libraries: |
            - name: "NimBLE-Arduino"

          # [FIX] Thay thế build-properties cũ thành cờ cli-compile-flags để ép cấu hình phần cứng USB TinyUSB
          cli-compile-flags: |
            --build-property "build.usb_mode=1"
            --build-property "build.cdc_on_boot=0"

          # [FIX] Đổi tên tham số từ sketch-path (số ít) thành sketch-paths (số nhiều) theo đúng quy chuẩn v1
          sketch-paths: |
            ./
            
          verbose: true

      - name: Thu thập và đóng gói File .BIN thành phẩm
        uses: actions/upload-artifact@v4
        with:
          name: ESP32S3_Hybrid_HID_Core
          # Đường dẫn lưu file binary sau khi GitHub Actions biên dịch thành công
          path: |
            /tmp/arduino-cli-sketches-***/*.bin
            ./build/**/*.bin
          if-no-files-found: warn
