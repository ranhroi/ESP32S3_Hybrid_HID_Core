name: Biên dịch ESP32-S3 Hybrid Core sang File BIN

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên GitHub

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Kiểm tra mã nguồn (Checkout)
        uses: actions/checkout@v4

      - name: Thiết lập cài đặt Arduino CLI chính thức
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.2.2"

      - name: Cài đặt Core phần cứng ESP32 (Espressif Official)
        run: |
          arduino-cli core update-index --additional-urls https://github.io
          arduino-cli core install esp32:esp32 --additional-urls https://github.io

      - name: Biên dịch mã nguồn và Ép cấu hình phần cứng TinyUSB
        uses: arduino/compile-sketches@v1
        with:
          fqbn: "esp32:esp32:esp32s3"
          
          # Cài đặt tự động thư viện NimBLEDevice bắt buộc cho dự án của bạn
          libraries: |
            - name: "NimBLE-Arduino"

          # ÉP CẤU HÌNH PHẦN CỨNG: Bật chế độ USB-OTG TinyUSB để bo mạch ESP32-S3 nhận diện làm Chuột/Bàn phím
          cli-compile-flags: |
            --build-property "build.usb_mode=1"
            --build-property "build.cdc_on_boot=0"

          # Đường dẫn số nhiều trỏ tới vị trí file .ino của bạn
          sketch-paths: |
            ./

      - name: Thu thập và đóng gói File .BIN thành phẩm
        uses: actions/upload-artifact@v4
        with:
          name: ESP32S3_Hybrid_HID_Core
          # Đường dẫn quét chuẩn xác mọi file build .bin được Arduino CLI xuất ra
          path: |
            /tmp/arduino-cli-sketches-**/*.bin
            /tmp/arduino/sketches/**/build/*.bin
            ./**/build/**/*.bin
          if-no-files-found: error
