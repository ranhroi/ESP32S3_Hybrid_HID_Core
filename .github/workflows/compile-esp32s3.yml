name: Biên dịch ESP32-S3 Hybrid Core sang File BIN

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên GitHub

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Kiểm tra mã nguồn (Checkout)
        uses: actions/checkout@v4

      - name: Thiết lập cài đặt Arduino CLI chính thức
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "0.35.3" # Khóa phiên bản CLI ổn định

      - name: Tận diệt cấu hình lỗi cũ và Cài đặt Core ESP32 (Mẫu Chuẩn Sạch)
        run: |
          # [CỰC KỲ QUAN TRỌNG] Xóa cứng cưỡng bức toàn bộ thư mục cấu hình ẩn chứa link github.io lỗi của GitHub runner
          rm -rf /home/runner/.arduino15/
          rm -rf ~/.arduino15/
          
          # Khởi tạo lại một file cấu hình hệ thống trống hoàn toàn mới
          arduino-cli config init --overwrite
          
          # Nạp duy nhất đường dẫn URL bổ sung của hãng Espressif
          arduino-cli config set board_manager.additional_urls https://github.io
          
          # Cập nhật lại toàn bộ chỉ mục index sạch từ đầu
          arduino-cli core update-index
          
          # Tải và cài đặt lõi phần cứng esp32
          arduino-cli core install esp32:esp32

      - name: Biên dịch mã nguồn và Ép cấu hình phần cứng TinyUSB
        uses: arduino/compile-sketches@v1
        with:
          fqbn: "esp32:esp32:esp32s3"
          
          # Cài đặt tự động thư viện NimBLEDevice cho dự án của bạn
          libraries: |
            - name: "NimBLE-Arduino"

          # ÉP CẤU HÌNH PHẦN CỨNG: Bật chế độ USB-OTG TinyUSB để bo mạch ESP32-S3 nhận diện làm Chuột/Bàn phím
          cli-compile-flags: |
            --build-property "build.usb_mode=1"
            --build-property "build.cdc_on_boot=0"

          # Đường dẫn nội bộ trỏ thẳng vào thư mục chứa file .ino của bạn trên Git
          sketch-paths: |
            ./ESP32S3_Hybrid_HID_Core

      - name: Thu thập và đóng gói File .BIN thành phẩm
        uses: actions/upload-artifact@v4
        with:
          name: ESP32S3_Hybrid_HID_Core_Firmware
          # Đường dẫn quét phủ rộng thu thập mọi file firmware .bin được xuất ra
          path: |
            /tmp/arduino-cli-sketches-**/*.bin
            /tmp/arduino/sketches/**/build/*.bin
            ./**/build/**/*.bin
          if-no-files-found: error
